---
name: build

# home (Node/Hono backend + Angular frontend) — gate the image on `npm run
# verify` (tsc + biome + angular-eslint + backend/frontend unit tests), then
# build + push xinutec/home:latest to Docker Hub. The k8s manifests + deploy live
# in the home monorepo (xinutec/pippijn code/kubes/home/k8s); the image tag is the
# only contract between this repo and the deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run verify

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/home:latest
          cache-from: type=registry,ref=xinutec/home:cache
          cache-to: type=registry,ref=xinutec/home:cache
