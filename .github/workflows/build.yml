---
name: build

# home (Node/Hono backend + Angular frontend) — gate the image on `pnpm run
# verify` (tsc + biome + angular-eslint + backend/frontend unit tests), then
# build + push xinutec/home:latest to Docker Hub. The k8s manifests + deploy live
# in the home monorepo (xinutec/pippijn code/kubes/home/k8s); the image tag is the
# only contract between this repo and the deploy.

# ⚠ Runs are serialised, newest wins. `:latest` is one mutable tag, so whichever
# build finishes LAST is what the cluster pulls — and GitHub's queue does not
# deliver in order. Measured on life 2026-09-13: three pushes ten minutes apart,
# and the newest commit's build went green while its own ANCESTOR sat pending for
# over forty minutes, ready to republish `:latest` from a superseded tree with
# nothing in any diff to explain it.
#
# ⚠ That stale run could be neither cancelled NOR deleted — 409 "has not been
# queued yet" and 403 "could not delete", for the same run, seconds apart. A run
# wedged before dispatch has no remedy, so a group that is ALREADY here is the
# only defence. `cancel-in-progress` is right because this branch only ever ships
# its tip: an older run's image is never the one wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Before setup-node, whose `cache: pnpm` shells out to `pnpm store path`.
      # The major floats: pinning it would be a second version held level with
      # the flake's by hand, and the lockfile is what has to match.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir frontend
      - run: pnpm run verify

  image:
    needs: verify
    # Docker Hub auth comes from repo secrets; the GITHUB_TOKEN only reads.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/home:latest
          cache-from: type=registry,ref=xinutec/home:cache
          cache-to: type=registry,ref=xinutec/home:cache
