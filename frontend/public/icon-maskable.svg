<?xml version="1.0" encoding="UTF-8"?>
<!-- Maskable variant of icon.svg: full bleed, for the launcher's own mask. The
     house is smaller than it looks like it needs to be: the safe zone bounds the
     stroke's outer edge, not the path. gen-icons.sh checks the rendered PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#00695c"/>
  <g fill="none" stroke="#ffffff" stroke-width="30"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 128 L381 236 V381 H131 V236 Z"/>
    <path d="M178 297 q19.5 -23 39 0 t39 0 t39 0 t39 0"/>
    <path d="M178 338 q19.5 -23 39 0 t39 0 t39 0 t39 0"/>
  </g>
</svg>
