# The frontend's settings. The root's file is the backend's; declaring
# `packages:` in either would fuse the two projects.
#
# pnpm runs only the install scripts listed here. The first four fetch or build
# a platform binary. @xinutec/ui-harness builds itself in `prepare`, and pnpm
# keys a git dependency by its full URL, so that line must follow the harness
# commit in package.json.
#
# A warm store hides a missing entry (CI fails with
# ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED), so test a change with
# `pnpm install --store-dir <empty dir>`.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  "@xinutec/ui-harness@https://codeload.github.com/xinutec/ui-harness/tar.gz/fd31cb2613875bb3ba4f429a66cdacff8077b2f1": true

# pnpm reads overrides here, not from package.json. immutable: sass pulls
# 5.1.7, and a GHSA covers everything below 5.1.8.
overrides:
  immutable: ^5.1.8
  piscina: ^5.2.0
  esbuild: ^0.28.2
  "@babel/core": ^7.29.6

# The catalog names only versions a day old (dev-lint tables/deps.dhall);
# strict, so a younger install fails instead of writing itself an exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
