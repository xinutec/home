<!-- The bar every app draws (`@xinutec/ui-scaffold`): the view menu and the app's
     name. What it holds is on every screen. -->
<ui-scaffold title="Home" [menu]="viewMenu" menuLabel="Switch view">
	<button
		matIconButton
		type="button"
		[matTooltip]="themeLabel()"
		aria-label="Toggle colour theme"
		(click)="toggleTheme()"
	>
		<mat-icon>{{ themeIcon() }}</mat-icon>
	</button>
</ui-scaffold>

<mat-menu #viewMenu="matMenu">
	@for (n of nav; track n.path) {
		<a
			mat-menu-item
			[routerLink]="n.path"
			routerLinkActive
			#rla="routerLinkActive"
			[attr.aria-current]="rla.isActive ? 'page' : null"
		>
			<mat-icon>{{ n.icon }}</mat-icon>
			<span>{{ n.label }}</span>
			@if (rla.isActive) {
				<mat-icon class="view-active">check</mat-icon>
			}
		</a>
	}
</mat-menu>

<main class="page">
	<router-outlet />
</main>
