<div class="wrap">
	<div #canvas class="canvas"></div>
	<div #stick class="stick" aria-hidden="true"></div>
	@if (walking() && !moved()) {
		<p class="hint">Drag to look · hold the left side to walk</p>
	}

	@if (stats()) {
		<p class="stats">{{ stats() }}</p>
	}

	<div class="status">
		@if (loading()) {
			<mat-progress-bar mode="indeterminate" />
		} @else if (error()) {
			<div class="banner banner-error">
				<mat-icon>cloud_off</mat-icon>
				<span>Could not load the house layout.</span>
				<button matButton type="button" (click)="load()">Retry</button>
			</div>
		} @else if (empty()) {
			<p class="empty">
				<mat-icon>home</mat-icon> No room called “{{ room }}” in the house layout.
			</p>
		}
	</div>
</div>
