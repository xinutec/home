<div class="wrap">
	<div #canvas class="canvas"></div>

	<div class="status">
		@if (loading()) {
			<mat-progress-bar mode="indeterminate" />
		} @else if (error()) {
			<div class="banner banner-error">
				<mat-icon>cloud_off</mat-icon>
				<span>Could not load the house layout.</span>
				<button matButton type="button" (click)="load()">Retry</button>
			</div>
		} @else if (empty()) {
			<p class="empty"><mat-icon>home</mat-icon> No house layout yet.</p>
		}
	</div>

	@if (rooms().length > 0) {
		<nav class="rooms" aria-label="View a room from inside">
			@for (r of rooms(); track r) {
				<a matButton="tonal" [routerLink]="['/house', r]">
					<mat-icon>visibility</mat-icon>
					{{ r }}
				</a>
			}
		</nav>
	}
</div>
