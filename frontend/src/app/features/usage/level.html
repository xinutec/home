@let at = clock();
<span class="level">
	<mat-progress-bar mode="determinate" [value]="pct() ?? 0" [attr.aria-label]="label() + ' used'" />
	@for (mark of days(); track mark) {
		<i class="day" [style.left.%]="mark" aria-hidden="true"></i>
	}
	<!-- Compared against `null` rather than truth-tested: a window in its first
	     minutes is genuinely at 0%, and dropping the mark there would hide it in
	     the one case where the fill being ahead of it matters most. -->
	@if (at !== null) {
		<i
			class="clock"
			[style.left.%]="at"
			[attr.title]="at.toFixed(0) + '% of the window had passed when this was read'"
			aria-hidden="true"
		></i>
	}
</span>
