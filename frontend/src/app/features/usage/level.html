@let at = clock();
<span class="level">
	<mat-progress-bar mode="determinate" [value]="pct() ?? 0" [attr.aria-label]="label() + ' used'" />
	@for (mark of days(); track mark) {
		<i class="day" [style.left.%]="mark" aria-hidden="true"></i>
	}
	<!-- Not truth-tested: 0 is a real position, a window's first minutes. -->
	@if (at !== null) {
		<i
			class="clock"
			[style.left.%]="at"
			[attr.title]="at.toFixed(0) + '% of the window had passed when this was read'"
			aria-hidden="true"
		></i>
	}
</span>
