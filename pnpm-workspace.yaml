# The backend's settings. frontend/ is a separate project with its own file and
# lockfile; declaring `packages:` here would fuse the two.
#
# pnpm runs only the install scripts listed here; esbuild needs its script to
# fetch its binary. A warm store hides a missing entry, so test a change with
# `pnpm install --store-dir <empty dir>`.
allowBuilds:
  esbuild: true

# pnpm reads overrides here, not from package.json.
overrides:
  esbuild: ^0.28.2

# The catalog names only versions a day old (dev-lint tables/deps.dhall);
# strict, so a younger install fails instead of writing itself an exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
