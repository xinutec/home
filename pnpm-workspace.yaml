# The BACKEND's settings. frontend/ has its own pnpm-workspace.yaml and is a
# separate project with a separate lockfile — this file must not declare
# `packages:`, or the two would become one workspace and the frontend's
# dependencies would resolve against the backend's tree.
#
# pnpm runs a dependency's install script only if it is listed here; npm runs
# them all silently. esbuild fetches its platform binary at install time and
# does not work without it. It is what pnpm named as ignored on a cold install:
# a WARM one passes without this, because the store already holds the unpacked
# binary. Test a change here with `pnpm install --store-dir <empty dir>`.
allowBuilds:
  esbuild: true

# Carried across from package.json's npm-format `overrides`, which pnpm does not
# read. That is not a formality: with the constraint only in package.json the
# imported lockfile resolved esbuild 0.27.7, under the ^0.28.1 floor it was
# supposed to enforce, and nothing said so.
overrides:
  esbuild: ^0.28.1
